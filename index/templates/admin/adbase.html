{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ScholarChronicle Admin{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'images/slms_logo.jpeg' %}">
    
    <link rel="stylesheet" href="{% static 'css/adbase.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h4 class="fw-bold">SC <span style="color: var(--secondary);">Admin</span></h4>
            </div>
            <nav class="sidebar-nav">
                <a href="{% url 'admindash' %}" 
                   class="nav-item {% if request.resolver_match.url_name == 'admindash' %}active{% endif %}">
                   <i class="fa-solid fa-gauge"></i> Dashboard
                </a>

                <a href="{% url 'adcourses' %}" 
                   class="nav-item {% if request.resolver_match.url_name == 'adcourses' %}active{% endif %}">
                   <i class="fa-solid fa-graduation-cap"></i> Courses
                </a>

                <a href="{% url 'students' %}" 
                   class="nav-item {% if request.resolver_match.url_name == 'students' %}active{% endif %}">
                   <i class="fa-solid fa-users"></i> Students
                </a>

                <hr class="sidebar-divider">

                <a href="{% url 'home' %}" class="nav-item">
                    <i class="fa-solid fa-house"></i> Back to Site
                </a>

                <a href="{% url 'login' %}" class="nav-item" style="color: #ff4d4d;">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
